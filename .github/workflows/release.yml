name: Release XMemo Claude plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"])')"
          if [[ "$release_version" != "$manifest_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate release source
        run: |
          claude plugin validate . --strict
          python scripts/validate-package.py
          node scripts/test-checkpoint-hook.js

      - name: Build immutable release archive
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          archive="XMemo-for-Claude-${release_version}.zip"
          mkdir -p dist
          git archive --format=zip --output="dist/${archive}" "$GITHUB_SHA"
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          archive="XMemo-for-Claude-${release_version}.zip"
          gh release create "$GITHUB_REF_NAME" \
            "dist/${archive}" \
            "dist/${archive}.sha256" \
            --verify-tag \
            --title "XMemo for Claude ${release_version}" \
            --generate-notes
